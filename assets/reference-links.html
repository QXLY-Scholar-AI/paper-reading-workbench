<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参考文献链接</title><style>body{font:15px 'Microsoft YaHei',sans-serif;color:#253e33;background:#f3f2ec;margin:0}main{max-width:1000px;margin:auto;padding:35px 25px}h1{font-family:'SimSun',serif}p{line-height:1.9}input,button{font:inherit;border:1px solid #cbd7c9;background:white;padding:10px 14px;border-radius:7px}input{width:min(400px,85%)}input[type=checkbox]{width:auto;margin-right:10px}article{padding:22px;background:white;border:1px solid #dce2d7;margin:15px 0;border-radius:10px}a{color:#285f46;margin-right:15px;display:inline-block;padding:7px 0}.meta{font-size:12px;color:#728073}details{font-size:12px;line-height:1.9}summary{cursor:pointer}#notice{color:#285f46}button{cursor:pointer}:focus-visible{outline:3px solid #b6a35c}</style></head><body><main><p>论文精读工作台 · beta</p><h1>参考文献，逐条可回查。</h1><p id="title"></p><p class="meta">已核验入口正常显示；题录已匹配但访问受限的入口以橙色标记，建议您先行确认；检索后完全没有匹配信息的条目以红色标记。文章页面与PDF分开标注，不批量下载。</p><input id="search" aria-label="搜索参考文献" placeholder="搜索标题、作者或编号"> <button id="filter">只看有链接</button> <button id="copy">复制链接列表</button> <button id="draft">复制所选文献的写作指令</button><p id="count" class="meta"></p><p id="notice" role="status"></p><div id="list"></div><textarea id="fallback" hidden style="width:100%;height:200px" aria-label="可复制链接"></textarea></main><script id="data" type="application/json">/*__REFERENCES__*/</script><script>
const D=JSON.parse(document.getElementById('data').textContent),$=s=>document.getElementById(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let only=false;const selected=new Set();
function allLinks(r){return [...r.links.map(l=>({...l,pending:false})),...(r.candidate_links||[]).map(l=>({...l,pending:true}))]}
function render(){let q=$('search').value.toLowerCase(),rs=D.references.filter(r=>(!only||allLinks(r).length)&&(`${r.number} ${r.citation}`).toLowerCase().includes(q));$('count').textContent=`显示 ${rs.length} / ${D.references.length} 条 · ${D.references.filter(r=>r.links.length).length} 条有已核验入口 · ${D.references.filter(r=>(r.candidate_links||[]).length).length} 条入口待用户确认`;
 $('list').innerHTML=rs.map(r=>{const pending=!!(r.candidate_links||[]).length,missing=r.status==='not_found';return `<article class="${pending?'reference-pending':missing?'reference-missing':''}"><p><label><input type="checkbox" data-ref="${esc(r.number)}" aria-label="选择文献 ${esc(r.number)}" ${selected.has(String(r.number))?'checked':''}></label>[${esc(r.number)}] ${esc(r.citation)}</p>${allLinks(r).map(l=>`<a class="${l.pending?'pending-link':''}" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${l.pending?'待用户确认 · ':''}${esc(l.label||(l.type==='pdf'?'PDF入口':'文章页面'))}${l.version?' · '+esc(l.version):''} ↗</a>`).join('')}${pending?'<p class="pending-message">题录身份已匹配；本次可读页面访问受限或返回验证码/空壳，尚未输出为已核验入口。建议您先行确认。</p>':missing?'<p class="missing-message">检索后未找到匹配信息。</p>':!r.links.length?'<p class="meta">存在候选信息，但暂不能确认身份匹配。</p>':''}${r.note?`<p class="meta">${esc(r.note)}</p>`:''}${allLinks(r).length?`<details><summary>匹配依据与核验日期</summary>${allLinks(r).map(l=>`<p>${l.pending?'待用户确认 · ':''}${esc(l.checked_at||'')} · ${esc(l.evidence)}<br>${esc(l.url)}</p>`).join('')}</details>`:''}</article>`}).join('')}
document.addEventListener('change',e=>{if(e.target.dataset.ref){const id=e.target.dataset.ref;e.target.checked?selected.add(id):selected.delete(id)}});$('draft').onclick=async()=>{let rs=D.references.filter(r=>selected.has(String(r.number)));if(!rs.length){$('notice').textContent='请先勾选需要的文献';return}let s='提醒：请填写课题！提交前请替换【填写课题】。\n\n请使用 paper-reading-workbench 的论文初稿（Beta），以《'+D.paper_title+'》为核心文献，以下条目作为补充候选，围绕拟议课题【填写课题】启动逐步写作项目。这篇论文只是核心材料之一；读取包内academic-writing-zh，与我明确主题和研究问题、核验材料并评估可行性、讨论确认论证大纲，再按约定范围起草、评审和修订，不直接拼出整稿。请先核验以下材料，区分全文、摘要、简介与题录：\n\n'+rs.map(r=>'['+r.number+'] '+r.citation+'\n'+allLinks(r).map(l=>(l.pending?'[待用户确认] ':'')+l.url).join('\n')).join('\n\n');try{await navigator.clipboard.writeText(s);$('notice').textContent='请填写课题！已复制所选文献与指令，请替换【填写课题】后提交'}catch(e){$('fallback').hidden=false;$('fallback').value=s;$('fallback').select()}};$('title').textContent=D.paper_title;$('search').oninput=render;$('filter').onclick=()=>{only=!only;$('filter').textContent=only?'显示全部':'只看有链接';render()};$('copy').onclick=async()=>{let s=D.references.map(r=>`[${r.number}] ${r.citation}\n`+allLinks(r).map(l=>(l.pending?'[待用户确认] ':'[已核验] ')+(l.type==='pdf'?'PDF入口':'文章页面')+': '+l.url).join('\n')).join('\n\n');try{await navigator.clipboard.writeText(s);$('notice').textContent='链接列表已复制'}catch(e){$('fallback').hidden=false;$('fallback').value=s;$('fallback').select()}};render();
</script></body></html>
