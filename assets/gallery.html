<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文图表画廊</title><style>
:root{font-family:'Microsoft YaHei',system-ui,sans-serif;color:#253a34;background:#f5f4ef}*{box-sizing:border-box}body{margin:0}header{padding:35px 5vw 24px;background:#193f35;color:#fff}header small{letter-spacing:3px;color:#c5d8cb}h1{font-size:32px;margin:12px 0}header p{max-width:950px;color:#d8e5db;line-height:1.8}nav{padding:18px 5vw;display:flex;gap:10px;flex-wrap:wrap;background:white;border-bottom:1px solid #dedfd6;position:sticky;top:0;z-index:5}input,select,button,a.download{font:inherit;padding:9px 12px;border:1px solid #d8ddd3;border-radius:7px;background:white;color:#264c3d}button,a.download{cursor:pointer}input{min-width:230px}button:hover,a.download:hover{background:#e8efe4}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b9a35a}main{max-width:1440px;margin:auto;padding:26px 4vw}.count{color:#6e7c73;margin-bottom:20px}.card{background:#fff;border:1px solid #dddfd4;border-radius:12px;overflow:hidden;margin-bottom:30px;box-shadow:0 5px 20px #17352606}.heading{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px 24px;border-bottom:1px solid #eee}.heading h2{margin:0;font-size:20px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{font-size:12px;padding:4px 8px;border-radius:5px;background:#e7f0e9}.tag.warn{background:#fff0d5;color:#795626}.comparison{display:grid;grid-template-columns:1fr 1fr;background:#f7f8f5;gap:1px}.pane{padding:20px;background:#fafbf8}.pane strong{display:block;font-size:12px;letter-spacing:1px;margin-bottom:14px;color:#60776c}.pane img{width:100%;max-height:650px;object-fit:contain;display:block;background:#fff;border:1px solid #e4e7df}.body{padding:22px 24px}.body p{line-height:1.9;margin:8px 0 18px;white-space:pre-wrap}.body h3{font-size:15px;margin:18px 0 8px}.body a{color:#2f6755;word-break:break-all}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}a.download{text-decoration:none;font-size:13px}details{border-top:1px solid #e4e8df;padding:15px 0}summary{cursor:pointer;font-weight:600}blockquote{margin:12px 0;padding:12px 18px;border-left:3px solid #b4c9b7;background:#f5f8f2;line-height:1.8;font-size:13px}pre{background:#1d302b;color:#e0ebe2;padding:20px;overflow:auto;font-size:12px;line-height:1.6;border-radius:8px;max-height:450px}textarea{width:100%;min-height:130px;padding:12px;border:1px solid #ccc}#message{position:fixed;bottom:20px;right:20px;background:#1b4234;color:white;padding:12px 20px;border-radius:7px;z-index:20}#bundle{margin:20px 0;padding:20px;background:#fff;border:1px solid #ccd7c8;border-radius:10px}footer{padding:20px 4vw;color:#718074;font-size:12px}@media(max-width:800px){.comparison{grid-template-columns:1fr}.heading{align-items:flex-start}header{padding-top:25px}h1{font-size:26px}}

#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}.tile{border:1px solid #d8dfd3;border-radius:12px;overflow:hidden;background:white;transition:transform .15s}.tile:hover{transform:translateY(-3px)}.thumb{border:0;border-radius:0;background:#f0f2eb;width:100%;height:235px;padding:15px;display:block}.thumb img{width:100%;height:100%;object-fit:contain}.tilebody{padding:18px}.tilebody h2{font-size:17px;margin:10px 0}.mini{font-size:11px;color:#788371}.excerpt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.8;font-size:12px;color:#768072;height:44px}.tileactions{display:flex;gap:8px;align-items:center;justify-content:space-between}.tileactions label{font-size:12px}.tileactions input{width:14px}.tileactions button{font-size:12px}header{padding:24px 5vw 18px}header h1{font-size:28px}header p{margin:7px 0;font-size:13px}nav{padding:12px 5vw}.detail-dialog{border:0;border-radius:12px;padding:0;width:min(1400px,96vw);max-width:96vw;height:94vh;max-height:94vh;background:#f5f6f0;color:#253a34}.detail-dialog::backdrop{background:#122b23aa}.detailbar{height:62px;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:white;border-bottom:1px solid #ddd}.detailbar strong{font-size:15px}.detail-scroll{height:calc(100% - 62px);overflow:auto;padding:15px}#figure-detail .card{margin:0}#figure-detail .pane img{max-height:58vh;cursor:zoom-in}#figure-detail .heading{padding:12px 20px}#figure-detail .body{padding-top:6px}.detailbar button:disabled{opacity:.4;cursor:default}.detailbar .close{font-size:20px;padding:4px 12px}@media(max-width:650px){.detailbar{padding:8px}.detailbar strong{font-size:12px}.detailbar button{font-size:12px;padding:7px}#cards{grid-template-columns:1fr}.thumb{height:220px}.detail-scroll{padding:5px}}
</style></head><body><header><small>PAPER READING WORKBENCH / FIGURE GALLERY · V2</small><h1>从读懂一张图，到画出自己的图</h1><p id="paper"></p><p>先精读，再回到图注、方法与结果；每份 R 代码都保留数据来路与运行状态。</p></header>
<nav><input id="search" aria-label="搜索图表" placeholder="搜索图名、图型或含义"><select id="mode" aria-label="数据模式"><option value="all">全部数据模式</option></select><button id="favfilter">只看收藏</button><button id="collect">汇总选中图的绘图要求</button><button id="export">备份收藏与选择</button><button id="import">导入收藏</button><input type="file" id="file" hidden accept="application/json"></nav>
<main><div id="bundle" hidden><h2>可复制的绘图要求</h2><textarea id="prompt" aria-label="绘图要求"></textarea><button id="copy-prompt">复制要求</button></div><div class="count" id="count"></div><div id="cards"></div></main><footer>画廊文件内嵌原图、重绘预览与可下载代码。收藏保存在当前浏览器；迁移前请备份。</footer><div id="message" hidden role="status"></div><dialog id="detail-dialog" class="detail-dialog" aria-label="图表详情"><div class="detailbar"><strong id="detail-label"></strong><div><button id="previous-figure">← 上一张</button> <button id="next-figure">下一张 →</button> <button id="close-detail" class="close" aria-label="关闭详情">×</button></div></div><div id="detail-scroll" class="detail-scroll"><textarea id="copy-fallback" hidden aria-label="待复制代码" style="width:100%;height:160px"></textarea><div id="figure-detail"></div></div></dialog><script id="data" type="application/json">/*__GALLERY__*/</script><script>
const D=JSON.parse(document.getElementById('data').textContent),$=s=>document.getElementById(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='paper-figure-gallery/v1:'+D.paper.sha256;let state={favorites:[],selected:[]},favOnly=false;
try{let v=JSON.parse(localStorage.getItem(key)||'null');if(v&&Array.isArray(v.favorites)&&Array.isArray(v.selected))state=v}catch(e){}
function toast(x){$('message').textContent=x;$('message').hidden=false;setTimeout(()=>$('message').hidden=true,3500)}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){toast('无法保存，请备份收藏')}}
function download(name,text){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('已复制')}catch(e){let target=$('detail-dialog').open?$('copy-fallback'):$('prompt');if(!$('detail-dialog').open)$('bundle').hidden=false;target.hidden=false;target.value=text;target.focus();target.select();toast('文字已选中，可按 Ctrl+C')}}
let visibleIds=[],currentId=null,detailTrigger=null;
function detail(f){return `<article class="card"><div class="heading"><div><h2>${esc(f.label)} · ${esc(f.chart_type)}</h2><div class="tags"><a class="tag" href="${esc(D.reader||'source.html')}#page=${f.page}" target="_blank" rel="noopener">PDF 第 ${f.page} 页 · 查看原文 ↗</a><span class="tag ${f.mode==='template'?'warn':''}">${esc(D.modes[f.mode])}</span><span class="tag ${f.run.status!=='success'?'warn':''}">${f.run.status==='success'?'R 已运行 · 产物已生成':f.run.status==='failed'?'R 运行失败':'R 尚未运行'}</span></div></div><div><button data-action="favorite" data-id="${f.id}" aria-label="收藏 ${f.id}">${state.favorites.includes(f.id)?'★ 已收藏':'☆ 收藏'}</button> <label><input style="min-width:0" type="checkbox" data-action="select" data-id="${f.id}" ${state.selected.includes(f.id)?'checked':''}>选用</label></div></div><div class="comparison"><div class="pane"><strong>论文原图 · 保留完整坐标与图例</strong><img src="${f.original}" alt="${esc(f.label)} 论文原图"></div><div class="pane"><strong>${f.mode==='template'?'示例数据模板 · 不是论文结果':'R 重绘 · '+esc(D.modes[f.mode])}</strong>${f.preview?`<img src="${f.preview}" alt="${esc(f.label)} R重绘预览">`:'<p>未取得成功运行产物，请查看运行记录。</p>'}</div></div><div class="body"><h3>插图解析</h3><p>${esc(f.interpretation)}</p><h3>数据来源</h3><p>${esc(f.data.source)}</p>${(f.data.sources||[]).map(s=>`<p>${esc(s.title)} · ${esc(s.status)} ${/^https?:\/\//.test(s.url)?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">来源页面 ↗</a>`:''}</p>`).join('')}<h3>研究应用建议</h3>${String(f.reuse||'').split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join('')}<details><summary>查看图注与精读依据</summary><p>${esc(f.caption)}</p>${f.context.map((c,i)=>`<blockquote><a href="${esc(D.reader||'source.html')}#page=${c.page}&annotation=GC-${esc(f.id)}-${i}" target="_blank" rel="noopener">PDF 第 ${c.page} 页 · ${esc(c.role)} ↗</a><br>${esc(c.quote)}</blockquote>`).join('')}</details><details><summary>查看 R 代码</summary><pre>${esc(f.code)}</pre></details><div class="actions"><button data-action="copy" data-id="${f.id}">复制 R 代码</button>${f.downloads.map(x=>`<a class="download" href="data:application/octet-stream;base64,${x.b64}" download="${esc(x.name)}">下载 ${esc(x.name)}</a>`).join('')}</div></div></article>`;}
function render(){let q=$('search').value.toLowerCase(),mode=$('mode').value,figs=D.figures.filter(f=>(!favOnly||state.favorites.includes(f.id))&&(mode==='all'||f.mode===mode)&&[f.label,f.chart_type,f.interpretation].join(' ').toLowerCase().includes(q));visibleIds=figs.map(f=>f.id);$('count').textContent=`显示 ${figs.length} / ${D.figures.length} 张 · 已收藏 ${state.favorites.length} 张 · 已选择 ${state.selected.length} 张`;
 $('cards').innerHTML=figs.map(f=>`<article class="tile"><button class="thumb" data-action="open" data-id="${f.id}" aria-label="查看 ${esc(f.label)} 详情"><img loading="lazy" src="${f.original}" alt="${esc(f.label)} 缩略图"></button><div class="tilebody"><span class="mini">PDF 第 ${f.page} 页 · ${esc(D.modes[f.mode])}</span><h2>${esc(f.label)} · ${esc(f.chart_type)}</h2><p class="excerpt">${esc(f.interpretation)}</p><div class="tileactions"><button data-action="open" data-id="${f.id}">查看详情 ↗</button><button data-action="favorite" data-id="${f.id}" aria-label="收藏 ${f.id}">${state.favorites.includes(f.id)?'★':'☆'}</button><label><input style="min-width:0" type="checkbox" data-action="select" data-id="${f.id}" ${state.selected.includes(f.id)?'checked':''}>选用</label></div></div></article>`).join('')||'<p>当前筛选下没有图表。</p>';
}
function openFigure(id,trigger){let f=D.figures.find(f=>f.id===id);if(!f)return;currentId=id;$('copy-fallback').hidden=true;if(trigger)detailTrigger=trigger;$('figure-detail').innerHTML=detail(f);$('detail-label').textContent=f.label+' · '+(visibleIds.indexOf(id)+1)+' / '+visibleIds.length;$('previous-figure').disabled=visibleIds.indexOf(id)<=0;$('next-figure').disabled=visibleIds.indexOf(id)>=visibleIds.length-1;if(!$('detail-dialog').open)$('detail-dialog').showModal();$('detail-scroll').scrollTop=0;}
function closeFigure(){$('detail-dialog').close();currentId=null;let b=$('cards').querySelector(`[data-action="open"][data-id="${detailTrigger}"]`);if(b)b.focus();}
$('close-detail').onclick=closeFigure;$('detail-dialog').addEventListener('cancel',e=>{e.preventDefault();closeFigure()});$('previous-figure').onclick=()=>{let i=visibleIds.indexOf(currentId);if(i>0)openFigure(visibleIds[i-1])};$('next-figure').onclick=()=>{let i=visibleIds.indexOf(currentId);if(i<visibleIds.length-1)openFigure(visibleIds[i+1])};
$('paper').textContent=D.paper.title+' · '+(D.paper.doi||'');for(let [k,v]of Object.entries(D.modes))$('mode').add(new Option(v,k));
$('search').oninput=render;$('mode').onchange=render;$('favfilter').onclick=()=>{favOnly=!favOnly;$('favfilter').textContent=favOnly?'显示全部':'只看收藏';render()};
function handleAction(e){let t=e.target.closest('[data-action]');if(!t)return;let f=D.figures.find(f=>f.id===t.dataset.id);if(!f)return;if(t.dataset.action==='open')return openFigure(f.id,f.id);if(t.dataset.action==='copy')return copy(f.code);let field=t.dataset.action==='favorite'?'favorites':'selected';state[field]=state[field].includes(f.id)?state[field].filter(x=>x!==f.id):[...state[field],f.id];save();let position=$('detail-scroll').scrollTop;render();if(currentId&&!visibleIds.includes(currentId))closeFigure();if(currentId){$('figure-detail').innerHTML=detail(D.figures.find(f=>f.id===currentId));$('detail-scroll').scrollTop=position;}}
$('cards').onclick=handleAction;$('figure-detail').onclick=e=>{if(e.target.tagName==='IMG'){let w=window.open('','_blank');if(w){let img=w.document.createElement('img');img.src=e.target.src;img.style.maxWidth='100%';w.document.body.appendChild(img)}}else handleAction(e)};
$('collect').onclick=()=>{let fs=D.figures.filter(f=>state.selected.includes(f.id));if(!fs.length)return toast('请先勾选要使用的图');$('bundle').hidden=false;$('prompt').value='请用 R 为我的数据作图，参考以下已精读图表。\n我的数据文件与列名：【请填写】\n研究目的和比较对象：【请填写】\n\n'+fs.map(f=>f.label+' / '+f.chart_type+'\n图义：'+f.interpretation+'\n替换方法：'+f.reuse+'\n来源与模式：'+D.modes[f.mode]+'；'+f.data.source).join('\n\n')+'\n\n请先核对数据字段、统计量和误差线定义，缺少信息时指出缺口，不把示例数值或论文结论用于我的数据。';$('bundle').scrollIntoView({behavior:'smooth'})};
$('copy-prompt').onclick=()=>copy($('prompt').value);$('export').onclick=()=>download('gallery-collection.json',JSON.stringify({schema:'paper-gallery-collection/v1',sha256:D.paper.sha256,...state},null,2));$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(v.schema!=='paper-gallery-collection/v1'||v.sha256!==D.paper.sha256||!['favorites','selected'].every(k=>Array.isArray(v[k])&&v[k].every(id=>D.figures.some(f=>f.id===id))))throw Error();state={favorites:[...new Set(v.favorites)],selected:[...new Set(v.selected)]};save();render();toast('收藏已导入')}catch(e){toast('导入失败：格式或论文不匹配')}};render();
function openLinkedFigure(){if(typeof window==='undefined')return;const id=new URLSearchParams(window.location.hash.slice(1)).get('figure');if(!D.figures.some(f=>f.id===id))return;favOnly=false;$('search').value='';$('mode').value='all';render();openFigure(id)}
if(typeof window!=='undefined'){window.addEventListener('hashchange',openLinkedFigure);openLinkedFigure()}
</script></body></html>
